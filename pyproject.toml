[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-env"
version = "0.1.0"
description = "OpenEnv environment for incident response commander evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "openai>=1.50.0",
  "openenv-core>=0.1.0",
  "pydantic>=2.8.0",
  "requests>=2.32.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
server = "server.app:main"

[tool.setuptools.packages.find]
include = ["incident_env*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
